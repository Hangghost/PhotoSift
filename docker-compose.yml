services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - photosift-data:/data
      - ${PHOTOS_DIR:-./_photos}:/photos:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  photosift-data:
